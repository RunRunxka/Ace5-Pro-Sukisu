name: OnePlus Build SuKiSu SUSFS Clang构建 - 优化版
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "分支"
        required: true
        default: 'sm8750'
      FEIL:
        description: "配置文件"
        required: true
        default: 'oneplus_ace5_pro'
      CPUD:
        description: "处理器代号"
        required: true
        default: 'sun'
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        default: 'android15'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.6'
      KERNEL_NAME:
        description: "修改内核名称"
        required: true
        default: '-android15-8-g013ec21bba94-abogki383916444'
      boot-gki:
        type: boolean
        description: "启用方法gki修补boot"
        required: true
        default: true
      hide_69:
        type: boolean
        description: "启用hide补丁"
        required: true
        default: false
      KPM:
        type: boolean
        description: "启用KPM补丁"
        required: true
        default: true
      ENABLE_LTO:
        description: '启用 LTO'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用更新的运行器
    env:
      # 优化的 ccache 配置
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "12G"  # 增加缓存大小
      CCACHE_DIR: "/home/runner/.ccache"
      # 构建优化
      MAKEFLAGS: "-j$(nproc)"
      NINJA_STATUS: "[%f/%t] "
      
    steps:
      # 最大化构建空间，但减少等待时间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 6144  # 减少保留空间
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'  # 额外清理

      # 并行执行基础配置
      - name: Configure Git & Install Dependencies
        run: |
          # 并行执行多个任务
          {
            git config --global user.name "RunRunxka"
            git config --global user.email "960228595@qq.com"
            git config --global init.defaultBranch main
            git config --global core.compression 1  # 减少压缩等级
            git config --global core.preloadindex true
            git config --global core.fscache true
          } &
          
          {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              python3 git curl ccache libelf-dev \
              build-essential bc bison flex libssl-dev \
              kmod cpio initramfs-tools-core \
              ninja-build
          } &
          
          wait  # 等待所有后台任务完成

      # 优化的 ccache 配置
      - name: Restore & Setup Ccache
        uses: actions/cache@v4  # 使用最新版本
        with:
          path: /home/runner/.ccache
          key: ccache-v2-${{ runner.os }}-${{ github.event.inputs.CPU }}-${{ github.event.inputs.FEIL }}-${{ hashFiles('**/build.config*') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ github.event.inputs.CPU }}-${{ github.event.inputs.FEIL }}-
            ccache-v2-${{ runner.os }}-${{ github.event.inputs.CPU }}-
            ccache-v2-${{ runner.os }}-

      - name: Setup Ccache Environment
        run: |
          mkdir -p $CCACHE_DIR
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache -M $CCACHE_MAXSIZE
          ccache -z  # 重置统计
          ccache -s

      # 优化 SSH 配置
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 并行写入密钥
          {
            echo "${{ secrets.OGKIPATCH }}" > ~/.ssh/id_ogkipatch
            chmod 600 ~/.ssh/id_ogkipatch
          } &
          {
            echo "${{ secrets.SCHED_EXT }}" > ~/.ssh/id_sched_ext  
            chmod 600 ~/.ssh/id_sched_ext
          } &
          wait
          
          # 优化的 SSH 配置
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel QUIET
            Compression yes
            ServerAliveInterval 60
            ServerAliveCountMax 10
            ControlMaster auto
            ControlPath ~/.ssh/control-%h-%p-%r
            ControlPersist 600

          Host github-ogki
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ogkipatch
            IdentitiesOnly yes

          Host github-sched-ext
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_sched_ext
            IdentitiesOnly yes
          EOF

      # 快速安装 repo
      - name: Install Repo Tool
        run: |
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      # 优化的仓库同步
      - name: Initialize Repo And Sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          
          # 使用更快的同步选项
          repo init -u https://github.com/RunRunxka/kernel_manifest.git \
            -b refs/heads/oneplus/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1 --no-clone-bundle --current-branch
          
          # 使用更多并行任务和优化选项
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle \
            --force-sync --optimized-fetch
          
          # 清理不需要的文件
          find kernel_platform -name "abi_gki_protected_exports_*" -delete 2>/dev/null || true

      # 并行设置 KernelSU 和 SUSFS
      - name: Setup KernelSU & SUSFS
        run: |
          cd kernel_workspace
          
          # 并行克隆仓库
          {
            cd kernel_platform
            curl -sSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          } &
          
          {
            git clone --depth=1 https://github.com/RunRunxka/susfs4ksu.git
            git clone --depth=1 https://github.com/ExmikoN/SukiSU_patch.git
          } &
          
          wait
          
          # 设置 KSU 版本
          cd kernel_platform/KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      # 批量复制和应用补丁
      - name: Apply All Patches
        run: |
          cd kernel_workspace/kernel_platform
          
          # 批量复制文件
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
          cp -r ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cp -r ../SukiSU_patch/other/lz4k/include/linux/* ./common/include/linux/
          cp -r ../SukiSU_patch/other/lz4k/lib/* ./common/lib/
          cp -r ../SukiSU_patch/other/lz4k/crypto/* ./common/crypto/
          
          cd ./common
          
          # 批量应用补丁
          PATCH_FILE="50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch"
          sed -i 's/-32,12 +32,38/-32,11 +32,37/g' "$PATCH_FILE"
          sed -i '/#include <trace\/hooks\/fs.h>/d' "$PATCH_FILE"
          patch -p1 < "$PATCH_FILE"
          
          cp ../../SukiSU_patch/hooks/syscall_hooks.patch ./
          patch -p1 -F 3 < syscall_hooks.patch
          
          # 条件性应用其他补丁
          if [ "${{ github.event.inputs.hide_69 }}" = "true" ]; then
            cp ../../SukiSU_patch/other/69_hide/${{ github.event.inputs.KERNEL_VERSION }}/69_hide.patch ./
            patch -p1 -F 3 < 69_hide.patch
          fi
          
          cp ../../SukiSU_patch/other/lz4k_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch

      # 批量配置内核选项
      - name: Configure Kernel
        run: |
          cd kernel_workspace/kernel_platform
          
          # 一次性写入所有配置
          cat >> ./common/arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_842=y
          CONFIG_LOCALVERSION="-4k"
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set  
          # CONFIG_DTBO_VALIDATION is not set
          EOF
          
          # 条件性添加配置
          if [ "${{ github.event.inputs.KPM }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          if [ "${{ github.event.inputs.ENABLE_LTO }}" = "true" ]; then
            echo "CONFIG_LTO_CLANG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_LTO_CLANG_THIN=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          # 移除检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          # 修改内核名称
          sed -i '186s|echo ".*"|echo "${KERNELVERSION}${scm_version}${config_localversion}"|' common/scripts/setlocalversion
          sed -i "s/\${scm_version}/${{ github.event.inputs.KERNEL_NAME }}/g" ./common/scripts/setlocalversion
          
          cd common
          git add -A && git commit -m "BUILD Kernel" --no-verify

      # 并行处理补丁仓库
      - name: Setup Additional Patches
        run: |
          cd kernel_workspace/kernel_platform
          
          # 并行克隆
          {
            if ! git clone git@github-ogki:RunRunxka/OGKI-PATCH.git --depth=1; then
              git clone https://github.com/RunRunxka/OGKI-PATCH.git --depth=1
            fi
          } &
          
          {
            if ! git clone git@github-sched-ext:RunRunxka/sched_ext.git --depth=1; then
              echo "Failed to clone sched_ext, skipping..."
            fi
          } &
          
          wait
          
          # 应用 OGKI 补丁
          if [ -d "./OGKI-PATCH" ]; then
            rm -rf ./OGKI-PATCH/.git
            cd common
            
            if [ "${{ github.event.inputs.boot-gki }}" = "false" ]; then
              sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
              patch -p1 < ../OGKI-PATCH/hmbird_patch.patch
            else
              patch -p1 < ../OGKI-PATCH/hmbird_gki.patch  
            fi
            cd ..
          fi
          
          # 设置 sched_ext
          if [ -d "./sched_ext" ]; then
            cp -r ./sched_ext/* ./common/kernel/sched/
            rm -rf ./sched_ext/.git
          fi

      # 优化的构建过程
      - name: Build Kernel
        run: |
          cd kernel_workspace/kernel_platform/common
          
          # 设置优化的构建环境
          export PATH="${{ github.workspace }}/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          export KERNEL_TIME=$(date -u)
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_TIME"
          export SOURCE_DATE_EPOCH=$(date +%s)
          
          # 优化的编译参数
          export MAKE_ARGS="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC='ccache clang' \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS='-O2 -Wno-error -pipe' \
            SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} \
            KBUILD_BUILD_USER=runner \
            KBUILD_BUILD_HOST=github-actions"
          
          # 使用最大并行度构建
          NPROC=$(nproc)
          echo "Building with $NPROC parallel jobs"
          
          make -j$NPROC $MAKE_ARGS gki_defconfig
          make -j$NPROC $MAKE_ARGS all
          
          mkdir -p ../dist
          cp out/arch/arm64/boot/Image ../dist/

      # 显示 ccache 统计
      - name: Show Build Stats
        run: |
          echo "=== Ccache Statistics ==="
          ccache -s
          echo "=========================="
          strings kernel_workspace/kernel_platform/common/out/vmlinux | grep "UTC" || true

      # 优化的后处理
      - name: Post-process Kernel
        run: |
          cd kernel_workspace/kernel_platform/dist/
          
          # 并行下载和处理
          {
            curl -sSLO https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.11-beta/patch_linux
            chmod +x patch_linux
          } &
          
          {
            cd ../../../
            git clone https://github.com/RunRunxka/AnyKernel3_Default.git --depth=1 --single-branch
            rm -rf ./AnyKernel3_Default/.git ./AnyKernel3_Default/push.sh
          } &
          
          wait
          
          ./patch_linux
          rm -f Image patch_linux
          mv oImage Image
          
          # 复制到 AnyKernel3
          cp Image ../../../AnyKernel3_Default/

      # 并行上传
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuKiSu_${{ env.KSUVER }}_${{ github.event.inputs.FEIL }}
          path: ./AnyKernel3_Default/*
          compression-level: 6  # 平衡压缩和速度
          
      - name: Upload Image
        uses: actions/upload-artifact@v4  
        with:
          name: Image_SuKiSu_${{ env.KSUVER }}_${{ github.event.inputs.FEIL }}
          path: kernel_workspace/kernel_platform/dist/Image
          compression-level: 6